name: dash0_flutter_sdk
description: Flutter SDK for Dash0 real user monitoring. Sends page views, HTTP spans, errors, metrics, vitals, session replay and custom events as OTLP/HTTP JSON, modeled on dash0-sdk-web.
version: 0.5.0
repository: https://github.com/Lock128/flutter-dash0-sdk
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
