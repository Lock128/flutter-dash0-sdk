name: dash0_flutter_sdk
description: Flutter SDK for Dash0 real user monitoring. Sends page views, HTTP spans, errors, metrics, vitals and custom events as OTLP/HTTP JSON.
version: 0.10.0
repository: https://github.com/Lock128/flutter-dash0-sdk
homepage: https://github.com/Lock128/flutter-dash0-sdk
issue_tracker: https://github.com/Lock128/flutter-dash0-sdk/issues
topics:
  - observability
  - opentelemetry
  - monitoring
  - telemetry
  - rum

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
